<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f6a5b0'/%3E%3Cstop offset='1' stop-color='%2358c9b9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='%232b2d5e'/%3E%3Cpath d='M14 50 V34 A18 18 0 0 1 50 34 V50' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='34' r='5' fill='%23ffd97a'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="幻境之门：梦境旅途 —— 一款原创网页 3D 空间错觉解谜游戏。旋转建筑、连通不可能之路，穿越八个梦境。" />
    <title>幻境之门：梦境旅途</title>
    <style>
      /* 首屏加载底色，防止白屏闪烁 */
      html, body, #root { height: 100%; margin: 0; background: #1c1e3f; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 120% at 50% 20%, #3b3f7a 0%, #1c1e3f 70%);
        color: #ffe8d6; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        z-index: 999; transition: opacity .6s ease;
      }
      #boot .ring {
        width: 74px; height: 74px; border-radius: 50%;
        border: 5px solid rgba(255, 232, 214, .18); border-top-color: #ffd97a;
        animation: bootspin 1.1s linear infinite;
      }
      #boot .t { font-size: 20px; letter-spacing: .35em; text-indent: .35em; opacity: .9; }
      #boot .s { font-size: 12px; letter-spacing: .2em; opacity: .5; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
      #boot.done { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="ring"></div><div class="t">幻境之门</div><div class="s">正在搭起梦境…</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
